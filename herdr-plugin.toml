id = "favorite-spaces"
name = "Favorite Spaces"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Save favorite folders with a name, then pick one to open as a new workspace."
platforms = ["macos", "linux"]

[[actions]]
id = "add"
title = "Favorites: save current folder"
contexts = ["workspace"]
command = ["bash", "bin/open-add.sh"]

[[actions]]
id = "pick"
title = "Favorites: new space from favorite"
contexts = ["global", "workspace"]
command = ["bash", "bin/open-pick.sh"]

[[panes]]
id = "add-pane"
title = "Add favorite"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/pane-add\""]

[[panes]]
id = "pick-pane"
title = "New space from favorite"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/pane-pick\""]

# herdr 0.7 does not bind keys from the manifest, and there is no plugin hook
# into the native "new workspace" dialog or the pane right-click menu. Bind
# keys yourself in ~/.config/herdr/config.toml, then `herdr server reload-config`:
#
#   [[keys.command]]
#   key = "prefix+f"
#   type = "plugin_action"
#   command = "favorite-spaces.pick"
#   description = "New space from favorite"
#
#   [[keys.command]]
#   key = "prefix+shift+f"
#   type = "plugin_action"
#   command = "favorite-spaces.add"
#   description = "Save current folder as favorite"
