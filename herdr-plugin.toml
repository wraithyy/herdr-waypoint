id = "waypoint"
name = "Waypoint"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Save folders with a name, then pick one from a fuzzy list to open as a new workspace."
platforms = ["macos", "linux"]

[[actions]]
id = "add"
title = "Waypoint: save current folder"
contexts = ["workspace"]
command = ["bash", "bin/action-add.sh"]

[[actions]]
id = "pick"
title = "Waypoint: new space from a waypoint"
contexts = ["global", "workspace"]
command = ["bash", "bin/open-pick.sh"]

[[actions]]
id = "install-keybinds"
title = "Waypoint: bind prefix+y / prefix+shift+v in config.toml"
contexts = ["global", "workspace"]
command = ["bash", "bin/install-keybinds.sh"]

# binds the default keys on first server start after install (silent no-op once bound)
[[startup]]
command = ["bash", "bin/install-keybinds.sh"]

[[panes]]
id = "pick-pane"
title = "New space from a waypoint"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/pane-pick\""]

# herdr 0.7 does not bind keys from the manifest, and there is no plugin hook
# into the native "new workspace" dialog or the pane right-click menu. Bind
# keys yourself in ~/.config/herdr/config.toml, then `herdr server reload-config`:
#
#   [[keys.command]]
#   key = "prefix+y"
#   type = "plugin_action"
#   command = "waypoint.pick"
#   description = "New space from a waypoint"
#
#   [[keys.command]]
#   key = "prefix+shift+v"
#   type = "plugin_action"
#   command = "waypoint.add"
#   description = "Save current folder as a waypoint"
